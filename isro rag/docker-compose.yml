# Qdrant server for the ISRO knowledge base.
#   docker compose up -d        -> REST + dashboard on http://localhost:6333/dashboard, gRPC on 6334
#   docker compose down         -> stop (data is kept in ./qdrant_storage)
# Then set QDRANT_URL=http://localhost:6333 in .env and run `uv run python index.py`.
services:
  qdrant:
    image: qdrant/qdrant:v1.20.0   # pinned; keep in step with the qdrant-client version
    container_name: isro-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API + web dashboard
      - "6334:6334"   # gRPC
    volumes:
      - ./qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
