[project]
name = "isro-rag"
version = "0.1.0"
description = "Builds the ISRO Wikipedia knowledge base in Qdrant (chunking, embeddings, hybrid search)"
requires-python = ">=3.11"
dependencies = [
    "qdrant-client>=1.12",
    "fastembed>=0.5",
    "openai>=1.50",
    "python-dotenv>=1.0",
    "ragas>=0.4",
    "langchain-community>=0.3,<0.4",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
